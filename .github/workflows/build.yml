name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Maira.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maira.apk
          path: Maira.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Maira latest build
          body: "Maira v7.2: apna brain (zero se trained), chat-only. Phone pe Maira.apk download karke install karo."
          prerelease: false
          make_latest: true
          files: Maira.apk
